{{- if .Values.components.scscf }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scscf
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
    app.kubernetes.io/component: scscf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: scscf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ims-sim
        app.kubernetes.io/component: scscf
    spec:
      containers:
        - name: scscf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--role", "scscf", "--advertise", "scscf.{{ .Values.namespace }}.svc.cluster.local", "--next-host", {{ .Values.peers.ssbcNorth | quote }}]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AS_SIM_TLS_CERT
              value: /tls/server.crt
            - name: AS_SIM_TLS_KEY
              value: /tls/server.key
            - name: AS_SIM_TLS_CA
              value: /tls/ca.crt
          ports:
            - name: sip-udp
              containerPort: {{ .Values.sip.udpPort }}
              protocol: UDP
            - name: sip-tcp
              containerPort: {{ .Values.sip.tcpPort }}
              protocol: TCP
            - name: sip-tls
              containerPort: {{ .Values.sip.tlsPort }}
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ims-sim-test-ca
---
apiVersion: v1
kind: Service
metadata:
  name: scscf
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
    app.kubernetes.io/component: scscf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: scscf
  ports:
    - name: sip-udp
      port: {{ .Values.sip.udpPort }}
      protocol: UDP
    - name: sip-tcp
      port: {{ .Values.sip.tcpPort }}
      protocol: TCP
    - name: sip-tls
      port: {{ .Values.sip.tlsPort }}
      protocol: TCP
{{- end }}
