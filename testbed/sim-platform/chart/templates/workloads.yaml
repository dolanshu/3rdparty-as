{{- if .Values.components.ui }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-load
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
    app.kubernetes.io/component: call-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: call-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ims-sim
        app.kubernetes.io/component: call-load
    spec:
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - --role
            - ui
            - --next-host
            - {{ .Values.peers.scscf | quote }}
            - --ui-host
            - "0.0.0.0"
            - --ui-port
            - {{ .Values.ui.port | quote }}
          env:
            - name: AS_SIM_TLS_CA
              value: /tls/ca.crt
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ims-sim-test-ca
---
apiVersion: v1
kind: Service
metadata:
  name: ims-sim-ui
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ims-sim
    app.kubernetes.io/component: call-load
spec:
  selector:
    app.kubernetes.io/component: call-load
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
{{- end }}
