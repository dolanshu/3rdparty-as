[project]
name = "as-simulators"
version = "0.1.0"
description = "Simulated operator network elements: S-SBC transparent bridge and the P-CSCF / S-CSCF iFC chain"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "simulator", "testbed"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# The simulators are built on the same SIP stack as the AS, so both sides of a
# test speak identical protocol behaviour.
dependencies = [
  "as-platform",
  "as-translation",
  "as-load",
]

[project.scripts]
as-simulators = "as_simulators.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_simulators"]

[tool.uv.sources]
as-platform = { workspace = true }
as-translation = { workspace = true }
as-load = { workspace = true }
