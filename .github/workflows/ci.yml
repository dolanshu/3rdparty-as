name: CI

# Four-layer gate, ADR-0015: ① fast -> ② integration -> ③ e2e -> ④ performance.
#
# One repository, one `uv sync`. The POC needed a sibling clone of `../as_platform`
# in every job because the library lived in another repository behind a `path`
# source; the monorepo removes that, and with it the reason that job could fail
# for reasons unrelated to the change under test.
#
# `uv sync --frozen` verifies the lock: it fails when uv.lock is out of step with
# pyproject.toml. Unlike the POC, every dependency is now either a registry
# dependency or a workspace member, so the lock actually covers all of them.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Layer ④ is a baseline, not a commit gate: it runs nightly, on demand and on
  # tags, so a slow or noisy capacity run never blocks a merge.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  UV_VERSION: "0.12.15"

jobs:
  # ---------------------------------------------------------------------------
  # ① fast — minutes. Blocking. Everything else waits on it.
  # ---------------------------------------------------------------------------
  fast:
    name: ① fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: pytest unit and contract
        run: uv run pytest -m "unit or contract" -q

  # ---------------------------------------------------------------------------
  # ② integration — AS against simulated peers on real sockets.
  # ---------------------------------------------------------------------------
  integration:
    name: ② integration
    runs-on: ubuntu-latest
    needs: [fast]
    permissions:
      contents: read
    # SKELETON EXCEPTION: no integration test exists yet, so pytest would exit 5
    # (no tests collected). Remove `continue-on-error` in the milestone that adds
    # the first integration test — M2 for the kernel, M3 for the applications.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: pytest integration
        run: uv run pytest -m integration -q

  # ---------------------------------------------------------------------------
  # ③ e2e — complete call flows including error branches and the console.
  # ---------------------------------------------------------------------------
  e2e:
    name: ③ e2e
    runs-on: ubuntu-latest
    needs: [integration]
    permissions:
      contents: read
    # SKELETON EXCEPTION: see the note on the integration job. Remove in M3.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: pytest e2e
        run: uv run pytest -m e2e -q

  # ---------------------------------------------------------------------------
  # ④ performance — capacity baseline. Nightly, tags and manual only.
  # No figure derived here may be published before M6; see docs/plan.md.
  # ---------------------------------------------------------------------------
  performance:
    name: ④ performance
    runs-on: ubuntu-latest
    needs: [fast]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    # SKELETON EXCEPTION: no real-socket harness exists yet (M6).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: pytest performance
        run: uv run pytest -m performance -q
      - name: Upload the run report as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-report
          path: artifacts/
          if-no-files-found: ignore

