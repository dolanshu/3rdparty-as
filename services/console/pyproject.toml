[project]
name = "as-console"
version = "0.1.0"
description = "Operations console: rule editing, call trace, statistics and configuration"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "console", "operations"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_console"]

[tool.hatch.build.targets.wheel.force-include]
"web/index.html" = "as_console/web/index.html"
"web/console.js" = "as_console/web/console.js"
"web/console.css" = "as_console/web/console.css"
