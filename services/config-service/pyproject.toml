[project]
name = "as-config-service"
version = "0.1.0"
description = "Rule version repository, change orders and staged distribution to AS instances"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "configuration", "change-management"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# psycopg: the PostgreSQL driver behind the ADR-0006 version repository
# (as_config_service.postgres_store). The ``binary`` extra ships the compiled
# wheel so a build host needs no libpq-dev; the driver is imported lazily, so
# the package itself is importable without it. See ADR-0006, ADR-0007.
dependencies = [
    "as-console",
    "fastapi>=0.115",
    "psycopg[binary]>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
as-config-bootstrap-admin = "as_config_service.bootstrap_admin:main"

[tool.uv.sources]
as-console = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_config_service"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]
