# Helm values 骨架 —— 仅注释说明，不绑定任何实际配置值
# 最终 values 结构参考 deploy/helm/README.md 里描述的旋钮，
# 完整填充随各部署里程碑落地。
#
# --- apps 层（用例容器，每用例独立 values 块） ---
# apps:
#   translation:
#     replicaCount:          # 副本数，来自话务模型
#     minReplicas:           # HPA 最小副本
#     draining:              # ADR-0009 ISPP 优雅退出
#       preStopSeconds:
#       graceWindowSeconds:
#       forceRelease:
#     peers:
#       allowlist:           # S-SBC 白名单（逗号分隔 IP/网段）
#     transport:
#       tls:
#         enabled:           # ADR-0016 端到端 TLS
#         secretRef:         # K8s Secret 引用，轮换不重启
#   antiFraud:               # 同 translation 结构
#
# --- services 层（控制面容器） ---
# services:
#   configService:
#     replicaCount:
#   console:
#     replicaCount:
#
# --- 状态存储（外部依赖，chart 内不部署） ---
# state:
#   redis:
#     sentinel:
#       hosts:
#       masterName:
#       password:
#   postgres:
#     url:                   # CONFIG_DB_URL
#
# --- 观测性（ADR-0005，必须非阻塞） ---
# observability:
#   otlpEndpoint:
#   exportMode:              # non-blocking | blocking（默认 non-blocking）
#
# --- 进程通用 ---
# logLevel:                  # DEBUG / INFO / WARNING / ERROR
# configVersion:             # 由 config-service 灰度注入
#
# =============================================================================
# M5 values contract — consumed by deploy/helm/templates/*
#
# The commented skeleton above is kept verbatim for traceability (it is the
# shape planned before M5). Everything below is the part the templates actually
# read. Comments in this file are English: deployment artifacts follow
# AGENT.md §5 (artifact language is English); only the historical block above
# is left in Chinese.
#
# Single-tenant, on-prem: one namespace holds one complete system
# (its own Redis / PostgreSQL / AS Pod group). See REQ-NF-9.
# Helm is the only production form; deploy/compose/ is dev-only. See ADR-0013.
#
# CAPACITY RULE — AGENT.md §2 / §6 and docs/plan.md §5.1 (O1):
# no CPS or concurrency figure is published before M6 measures it. Every key
# below that would encode a capacity assumption is left null, and the template
# that consumes it does not render the resource at all rather than fall back to
# a guessed number. See deploy/helm/README.md for the full list.
# =============================================================================

# Namespace of the whole system. One customer = one namespace (REQ-NF-9).
# Defaults to the release namespace when empty.
namespace: ""

# Overrides the chart name inside generated object names. Left empty on purpose:
# the chart never hard-codes a customer name.
nameOverride: ""

image:
  # Placeholder only. There is no public registry for this product; set the
  # customer-internal registry at install time.
  repository: "registry.example.com/3rdparty-as"
  # Empty -> Chart.appVersion is used (see _helpers.tpl "as.image").
  tag: ""
  pullPolicy: IfNotPresent

# One use case = one process = one Deployment. See ADR-0002.
# The templates range over this list; a use case with enabled: false renders
# nothing (no Deployment, Service, HPA or PDB).
useCases:
  - name: translation
    enabled: true
    # M5 evidence only: simulates in-flight calls (see m5-downscale-runbook.md).
    simulatedActiveCalls: null
    # null -> the Deployment renders `replicas: 1` as a PLACEHOLDER so that
    # `helm template` and a dry install produce a valid manifest. That 1 is a
    # rendering fallback, NOT a capacity conclusion: the real replica floor is
    # measured in M6 (O1) and then set here.
    replicaCount: null
    # Resource requests/limits are rendered only when non-empty. Left empty:
    # sizing is downstream of the same M6 measurement as O1.
    # Example shape (do not commit numbers before M6):
    #   resources:
    #     requests: {cpu: "500m", memory: "512Mi"}
    #     limits:   {cpu: "1", memory: "1Gi"}
    resources: {}
  - name: anti-fraud
    enabled: true
    replicaCount: null
    resources: {}

# Config-service control plane. Disabled by default so existing AS-only chart
# installs do not acquire database credentials or an externally managed Secret.
# Enabling it requires an external Secret and a pre-provisioned NOLOGIN runtime
# role; the chart never creates or populates that Secret.
services:
  configService:
    enabled: false
    replicaCount: 1
    image:
      repository: "registry.example.com/3rdparty-as-config-service"
      tag: ""
    secretName: ""
    runtimeRole: ""
    configSchema: as_config
    auditSchema: console_audit
    host: "0.0.0.0"
    port: 8000
    proxyHeaders: false
    trustedProxies: []
    resources: {}
    ingress:
      enabled: false
      # This chart's optional Ingress supports ingress-nginx only.
      # It always redirects and forces HTTPS; other controllers need separately
      # reviewed external configuration and must not use this template.
      className: nginx
      host: ""
      tlsSecretName: ""

# SIP listener settings. Ports are protocol constants (5060/5061), not capacity
# figures.
sip:
  listenAddr: "0.0.0.0"
  port: 5060          # SIP over UDP
  tlsPort: 5061       # SIP over TLS (ADR-0016)
  # Comma-separated IPs/CIDRs of the operator's S-SBC. Anything that can
  # impersonate the S-SBC can inject calls (ADR-0016), so this is a security
  # control, not a routing hint. Empty must be treated as fail-closed by the
  # process; set it per customer.
  peerAllowlist: ""
  # Testbed-only escape hatch for the H-4 fail-closed guard in
  # templates/deployment.yaml (M5.1 minimal). Default false: production renders
  # fail when peerAllowlist is empty. See ADR-0016.
  allowEmptyAllowlistForTest: false

# Bundled in-cluster PostgreSQL + Redis (ADR-0026 Option E). When enabled, the
# chart renders state workloads in the same namespace; postgres.host / redis.url
# default to cluster Service DNS unless overridden (external-store mode).
stateStores:
  enabled: false
  networkPolicy:
    enabled: true
  # Dev/kind only: populate credentials + config-service runtime Secret. Never
  # use true in customer production values without replacing secrets out-of-band.
  bootstrapDevCredentials: false
  devCredentials:
    postgresSuperuserPassword: "postgres"
    configOwnerPassword: "as_config_owner_dev"
    configWebUser: "as_config_web"
    configWebPassword: "as_config_web_dev"
    auditHmacKeyB64: "a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s="
  postgres:
    image: "postgres:12.22"
    database: "as_config"
    persistence:
      enabled: false
      size: "5Gi"
  redis:
    image: "redis:7-alpine"
    port: 6379
  # Optional one-shot schema migrate (owner DSN only). Production: set ownerSecretName;
  # kind/dev: enable with bootstrapDevCredentials (inline DSN, dev passwords only).
  migrateJob:
    enabled: false
    ownerSecretName: ""
    ownerSecretKey: AS_CONFIG_OWNER_DSN
    backoffLimit: 2
    ttlSecondsAfterFinished: 86400
    annotations: {}

# Runtime state store (Redis + Sentinel) — external when stateStores.enabled is
# false (ADR-0002 / ADR-0007).
redis:
  # Direct URL. Prefer Sentinel below in production; this is the dev/simple path.
  url: ""
  sentinel:
    enabled: false
    # Unresolved: O5 (disaster-recovery level N+1 vs N+M) and D3 (Redis client
    # and Sentinel wiring, split-brain window). Empty on purpose — do not invent
    # a topology before those are decided.
    masters: []
    addresses: []

# Governance store (PostgreSQL) — external when stateStores.enabled is false
# (ADR-0006 / ADR-0007).
postgres:
  host: ""
  port: 5432
  database: ""
  # Name of the Secret holding CONFIG_DB_USER / CONFIG_DB_PASSWORD. Leave empty
  # to use the chart-managed Secret (`<fullname>-credentials`, placeholders
  # only — see secret.yaml); point at a customer-managed Secret to skip it.
  secretName: ""

# Transport security. End-to-end TLS to the S-SBC with a client certificate is
# mandatory (ADR-0016); certificate rotation is a hot reload, never a restart.
tls:
  enabled: true
  # Secret holding tls.crt / tls.key / ca.crt. Always externally managed
  # (customer PKI); the chart only references it. Empty with enabled=true is a
  # render-time failure (H-3 fail-closed, see templates/deployment.yaml), not
  # a skipped mount — fix it before install rather than shipping a broken
  # trust anchor.
  secretName: ""
  requireClientCertificate: true

# In-service upgrade semantics: ISSU is draining, not state migration
# (ADR-0009). These two are timeouts, not capacity figures, so conservative
# defaults are allowed:
#   - preStopSleepSeconds: lets the Endpoint removal propagate before the
#     process stops accepting new calls.
#   - terminationGracePeriodSeconds: bounds how long the process shell may wait
#     for active_calls to reach zero before it is SIGKILLed.
draining:
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 300

# Horizontal Pod Autoscaling. Every value below is a CAPACITY figure and is
# therefore left null until M6 (O1) measures it: fill them from that
# measurement, never from intuition. With enabled: true, hpa.yaml makes the
# render fail immediately (non-zero helm exit) when minReplicas / maxReplicas
# are missing, and fails again when min/max are set but no target threshold is
# non-null (an HPA carrying an empty metrics list would be rejected by the API
# server). enabled: false — the default — renders no HPA at all. See ADR-0010.
autoscaling:
  enabled: false
  targetCPUUtilizationPercentage: null   # O1 / M6
  targetMemoryUtilizationPercentage: null # O1 / M6
  customMetric:
    # e.g. as_active_calls — the per-Pod average that should trigger a scale-out.
    name: null        # O1 / M6
    targetValue: null # O1 / M6
  minReplicas: null   # O1 / M6
  maxReplicas: null   # O1 / M6

# Downscale guard: never delete a Pod that still carries calls. The threshold is
# a state condition ("more than zero calls in flight"), not a capacity figure —
# any non-zero value would leave a call to be dropped. See ADR-0010 and
# docs/architecture/新系统整体架构.md §4.1.
downscaleGuard:
  enabled: true
  protectWhenActiveCallsAbove: 0

# HTTP health/metrics side channel (M5). Readiness fails while draining (ADR-0009).
health:
  port: 8080

# Liveness / readiness probes. Conservative detection parameters only; they say
# nothing about how much traffic a Pod can carry (O1 / M6).
probes:
  liveness:
    enabled: true
    portName: health-http
    httpPath: /health/live
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 5
  readiness:
    enabled: true
    portName: health-http
    httpPath: /health/ready
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# PodDisruptionBudget, one per use case. minAvailable accepts an integer or a
# percentage string. Left null: the template renders NO PDB rather than
# inventing an availability figure. Set it per customer SLA (related to O5).
podDisruptionBudget:
  minAvailable: null

# Observability (ADR-0005): export must never block the call path; the backend
# is chosen by deployment, not by code.
telemetry:
  # e.g. http://otel-collector.observability.svc:4317. null -> exporting stays
  # unconfigured (NoOp sink), which is the safe default on the call path.
  otlpEndpoint: null
  # Payload logging (SIP bodies, SDP) is opt-in and off by default
  # (ADR-0005, AGENT.md §13).
  payloadLogsEnabled: false

# Process-wide knobs (kept from the skeleton above, now live).
logLevel: INFO
# Version reported by the instance. Injected by config-service canary
# distribution (ADR-0006); an empty value means "not yet reported".
configVersion: ""
