# Helm values 骨架 —— 仅注释说明，不绑定任何实际配置值
# 最终 values 结构参考 deploy/helm/README.md 里描述的旋钮，
# 完整填充随各部署里程碑落地。
#
# --- apps 层（用例容器，每用例独立 values 块） ---
# apps:
#   translation:
#     replicaCount:          # 副本数，来自话务模型
#     minReplicas:           # HPA 最小副本
#     draining:              # ADR-0009 ISPP 优雅退出
#       preStopSeconds:
#       graceWindowSeconds:
#       forceRelease:
#     peers:
#       allowlist:           # S-SBC 白名单（逗号分隔 IP/网段）
#     transport:
#       tls:
#         enabled:           # ADR-0016 端到端 TLS
#         secretRef:         # K8s Secret 引用，轮换不重启
#   antiFraud:               # 同 translation 结构
#
# --- services 层（控制面容器） ---
# services:
#   configService:
#     replicaCount:
#   console:
#     replicaCount:
#
# --- 状态存储（外部依赖，chart 内不部署） ---
# state:
#   redis:
#     sentinel:
#       hosts:
#       masterName:
#       password:
#   postgres:
#     url:                   # CONFIG_DB_URL
#
# --- 观测性（ADR-0005，必须非阻塞） ---
# observability:
#   otlpEndpoint:
#   exportMode:              # non-blocking | blocking（默认 non-blocking）
#
# --- 进程通用 ---
# logLevel:                  # DEBUG / INFO / WARNING / ERROR
# configVersion:             # 由 config-service 灰度注入
