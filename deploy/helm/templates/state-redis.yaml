{{- if .Values.stateStores.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "as.fullname" . }}-redis
  namespace: {{ include "as.namespace" . }}
  labels:
    {{- include "as.labels" . | nindent 4 }}
    app.kubernetes.io/component: state-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "as.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: state-redis
  template:
    metadata:
      labels:
        {{- include "as.labels" . | nindent 8 }}
        app.kubernetes.io/component: state-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.stateStores.redis.image | quote }}
          ports:
            - name: redis
              containerPort: {{ .Values.stateStores.redis.port }}
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "as.fullname" . }}-redis
  namespace: {{ include "as.namespace" . }}
  labels:
    {{- include "as.labels" . | nindent 4 }}
    app.kubernetes.io/component: state-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "as.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: state-redis
  ports:
    - name: redis
      port: {{ .Values.stateStores.redis.port }}
      targetPort: redis
{{- end }}
