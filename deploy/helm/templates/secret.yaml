{{/*
Credentials Secret — PLACEHOLDERS ONLY.

Nothing in this file carries a real value: AGENT.md §13 forbids committing
credentials, certificates or real addresses. The shipped Secret therefore holds
empty strings and MUST be replaced before the first install, either by
`--set` / `-f` with a customer values file, or by pointing
`postgres.secretName` at an externally managed Secret (customer vault /
Sealed Secrets / External Secrets), in which case this object is not rendered
at all.

Refuses to render when postgres.secretName is set: the customer Secret is the
single source then, and rendering an empty one alongside it would silently win
or lose depending on apply order.
*/}}
{{- if not .Values.postgres.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "as.fullname" . }}-credentials
  namespace: {{ include "as.namespace" . }}
  labels:
    {{- include "as.labels" . | nindent 4 }}
  annotations:
    # Reminder for whoever audits the release: this object is a template, not
    # a credential store.
    as.3rdparty/credentials: "placeholder-replace-before-install"
type: Opaque
stringData:
  {{- if .Values.stateStores.bootstrapDevCredentials }}
  CONFIG_DB_USER: {{ .Values.stateStores.devCredentials.configWebUser | quote }}
  CONFIG_DB_PASSWORD: {{ .Values.stateStores.devCredentials.configWebPassword | quote }}
  CONFIG_DB_OWNER_PASSWORD: {{ .Values.stateStores.devCredentials.configOwnerPassword | quote }}
  POSTGRES_SUPERUSER_PASSWORD: {{ .Values.stateStores.devCredentials.postgresSuperuserPassword | quote }}
  REDIS_PASSWORD: ""
  {{- else }}
  CONFIG_DB_USER: ""
  CONFIG_DB_PASSWORD: ""
  REDIS_PASSWORD: ""
  {{- end }}
{{- end }}
{{/*
TLS material is NEVER stored here. Certificates come from the customer PKI and
are referenced by `tls.secretName` (see ADR-0016); rotation is a hot reload of
the mounted files, never a Pod restart.
*/}}
