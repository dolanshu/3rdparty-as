{{- if and .Values.stateStores.enabled .Values.stateStores.bootstrapDevCredentials .Values.services.configService.enabled }}
{{- $host := include "as.postgres.host" . }}
{{- $db := include "as.postgres.database" . }}
{{- $webPass := .Values.stateStores.devCredentials.configWebPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "as.fullname" . }}-config-runtime
  namespace: {{ include "as.namespace" . }}
  labels:
    {{- include "as.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-service
  annotations:
    as.3rdparty/credentials: "dev-bootstrap-only-ADR-0026"
type: Opaque
stringData:
  AS_CONFIG_DSN: {{ printf "postgresql://as_config_web:%s@%s:5432/%s" $webPass $host $db | quote }}
  AS_AUDIT_RESOURCE_HMAC_KEY_B64: {{ .Values.stateStores.devCredentials.auditHmacKeyB64 | quote }}
{{- end }}
