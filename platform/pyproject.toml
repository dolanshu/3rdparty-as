[project]
name = "as-platform"
version = "0.1.0"
description = "Kernel of the third-party IMS AS: process shell, B2BUA state machine, the decide() seam and the pluggable Transport / StateStore seams"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "b2bua", "application-server", "platform"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# The SIP stack is deliberately NOT pinned here. M0 does not select the
# production SIP stack; that decision is recorded in ADR-0019 once the
# evaluation is complete. Until then platform/ defines language-agnostic seams
# (Transport, StateStore, call controller shell) that do not depend on any
# particular stack. The POC behaviour baseline, which currently runs on sippy,
# lives in testbed/simulators/ and is consumed only as a testbed asset.
dependencies = [
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_platform"]
