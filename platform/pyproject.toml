[project]
name = "as-platform"
version = "0.1.0"
description = "Kernel of the third-party IMS AS: process shell, B2BUA state machine, the decide() seam and the pluggable Transport / StateStore seams"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "b2bua", "application-server", "platform"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# One SIP stack version in one interpreter: the pin is workspace-wide and must
# not be widened without an ADR (ADR-0001). Every application depends on this
# package, so a second sippy version cannot enter the tree unnoticed.
dependencies = [
  "sippy==2.4.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_platform"]
